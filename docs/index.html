<title>My Daily Pick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap">

<style>
  /* layout: full-bleed dark canvas, sticky filter bar, masonry-ish product grid */
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --fg: #e8e8e8;
    --fg-muted: #666;
    --fg-dim: #3a3a3a;
    --accent: #c8f542;
    --accent-fg: #0d0d0d;
    --musinsa: #ff4a4a;
    --cm29: #4a9eff;
    --tag-bg: #1f1f1f;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --surface2: #f0f0ee;
      --border: #e0e0dc;
      --fg: #111111;
      --fg-muted: #888;
      --fg-dim: #d0d0cc;
      --accent: #8bc400;
      --accent-fg: #ffffff;
      --tag-bg: #ebebea;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --surface2: #f0f0ee;
    --border: #e0e0dc;
    --fg: #111111;
    --fg-muted: #888;
    --fg-dim: #d0d0cc;
    --accent: #8bc400;
    --accent-fg: #ffffff;
    --tag-bg: #ebebea;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100%;
  }

  /* HEADER */
  .header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    gap: 12px;
  }
  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg);
    white-space: nowrap;
  }
  .logo span {
    color: var(--accent);
  }

  /* FILTER BAR */
  .filter-bar {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-bar-inner {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
    min-width: max-content;
  }
  .filter-label {
    font-size: 10px;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-right: 4px;
    white-space: nowrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-muted);
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--fg-muted); color: var(--fg); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    font-weight: 500;
  }
  .chip-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* SITE TOGGLE */
  .site-toggle {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .site-btn {
    padding: 5px 12px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    font-size: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--fg-muted);
    white-space: nowrap;
  }
  .site-btn:hover { border-color: var(--fg-muted); color: var(--fg); }
  .site-btn.active-musinsa { background: var(--musinsa); border-color: var(--musinsa); color: #fff; }
  .site-btn.active-cm29 { background: var(--cm29); border-color: var(--cm29); color: #fff; }
  .site-btn.active-all { background: var(--surface2); border-color: var(--border); color: var(--fg); }

  /* SORT + COUNT ROW */
  .meta-row {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .result-count {
    font-size: 12px;
    color: var(--fg-muted);
  }
  .result-count strong {
    color: var(--fg);
    font-weight: 500;
  }
  .sort-select {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    appearance: none;
    -webkit-appearance: none;
  }

  /* PRODUCT GRID */
  .grid-wrap {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: 40px;
  }
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px 14px;
  }
  @media (min-width: 600px) {
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  }

  /* PRODUCT CARD */
  .card {
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-img {
    aspect-ratio: 3/4;
    background: var(--surface2);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    transition: transform 0.2s;
  }
  .card:hover .card-img { transform: translateY(-2px); }
  .card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-img-placeholder {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: var(--fg-dim);
  }
  .card-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 3px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .badge-musinsa { background: var(--musinsa); color: #fff; }
  .badge-cm29 { background: var(--cm29); color: #fff; }
  .card-like {
    position: absolute;
    top: 8px; right: 8px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: transform 0.15s;
  }
  .card-like:hover { transform: scale(1.15); }
  .card-like.liked { background: rgba(255,74,74,0.2); }
  .card-info { display: flex; flex-direction: column; gap: 2px; }
  .card-brand {
    font-size: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .card-name {
    font-size: 13px;
    color: var(--fg);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-price {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .card-price .discount {
    color: var(--musinsa);
    margin-right: 4px;
  }
  .card-price .original {
    font-size: 11px;
    font-weight: 400;
    color: var(--fg-muted);
    text-decoration: line-through;
    margin-left: 4px;
  }
  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 2px;
  }
  .tag {
    background: var(--tag-bg);
    color: var(--fg-muted);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
  }

  /* EMPTY STATE */
  .empty {
    padding: 80px 20px;
    text-align: center;
    color: var(--fg-muted);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .empty.show { display: flex; }
  .empty-icon { font-size: 36px; margin-bottom: 4px; }
  .empty p { font-size: 13px; }

  /* ADD SITE BUTTON */
  .add-site-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 100px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--fg-muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .add-site-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* LOADING SKELETON */
  .skeleton { animation: shimmer 1.5s infinite; }
  @keyframes shimmer {
    0% { opacity: 0.5; }
    50% { opacity: 0.8; }
    100% { opacity: 0.5; }
  }
  .skel-card { display: flex; flex-direction: column; gap: 8px; }
  .skel-img { aspect-ratio: 3/4; background: var(--surface2); border-radius: 8px; }
  .skel-line { height: 10px; background: var(--surface2); border-radius: 4px; }

  /* REFRESH BTN */
  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .refresh-btn:hover { color: var(--accent); border-color: var(--accent); }
  .refresh-btn svg { transition: transform 0.3s; }
  .refresh-btn.spinning svg { transform: rotate(360deg); }

  /* DEMO NOTICE */
  .demo-notice {
    margin: 0 max(16px, env(safe-area-inset-left, 0px));
    margin-bottom: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    font-size: 11px;
    color: var(--fg-muted);
    line-height: 1.6;
  }
  .demo-notice strong { color: var(--fg); }
</style>

<div class="header">
  <div class="header-inner">
    <div class="logo">My Daily <span>Pick</span></div>
    <div class="site-toggle">
      <button class="site-btn active-all" data-site="all">전체</button>
      <button class="site-btn" data-site="musinsa">무신사</button>
      <button class="site-btn" data-site="cm29">29CM</button>
      <button class="add-site-btn" onclick="showAddSite()">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        사이트 추가
      </button>
    </div>
  </div>
  <div class="filter-bar">
    <div class="filter-bar-inner">
      <span class="filter-label">카테고리</span>
      <button class="chip active" data-cat="all">전체</button>
      <button class="chip" data-cat="outer">아우터</button>
      <button class="chip" data-cat="top">상의</button>
      <button class="chip" data-cat="bottom">하의</button>
      <button class="chip" data-cat="shoes">신발</button>
      <button class="chip" data-cat="acc">액세서리</button>
      <button class="chip" data-cat="bag">가방</button>
    </div>
  </div>
</div>

<div class="meta-row">
  <div class="result-count">
    <strong id="count">0</strong>개 아이템
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="refresh-btn" id="refreshBtn" onclick="refreshFeed()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 2.5A4.5 4.5 0 1 1 2.5 6"/>
        <path d="M10 2.5V1M10 2.5H8.5"/>
      </svg>
      새로고침
    </button>
    <select class="sort-select" id="sortSelect" onchange="renderGrid()">
      <option value="new">최신순</option>
      <option value="price-asc">가격 낮은순</option>
      <option value="price-desc">가격 높은순</option>
      <option value="discount">할인율순</option>
    </select>
  </div>
</div>

<div class="grid-wrap">
  <div class="product-grid" id="productGrid"></div>
  <div class="empty" id="emptyState">
    <div class="empty-icon">🔍</div>
    <p id="emptyMsg">불러오는 중...</p>
  </div>
</div>

<script>
window.__STATIC_DATA__ = {"updatedAt":"2026-11-24T07:44:58.896Z","items":[{"id":"7704070","site":"musinsa","name":"데일리 모크넥 집업 니트 - 5COLOR","brand":"수아레","price":59000,"imageUrl":"https://image.msscdn.net/images/goods_img/20261104/7704070/7704070_17937706044648_500.jpg","productUrl":"https://www.musinsa.com/app/goods/7704070","category":"아우터"},{"id":"7551551","site":"musinsa","name":"트랙 에어울 니트 자켓_3 COLOR","brand":"데이","price":71000,"imageUrl":"https://image.msscdn.net/images/goods_img/20261019/7551551/7551551_17923899404061_500.jpg","productUrl":"https://www.musinsa.com/app/goods/7551551","category":"아우터"},{"id":"7698860","site":"musinsa","name":"아카이브 홀스 오버핏 맨투맨ge0124","brand":"젠프리","price":57800,"imageUrl":"https://image.msscdn.net/images/goods_img/20261104/7698860/7698860_17937182928521_500.png","productUrl":"https://www.musinsa.com/app/goods/7698860","category":"아우터"},{"id":"7565022","site":"musinsa","name":"ARC STRIPE LAYER SHIRT , ASH OAT","brand":"하츠코시","price":117000,"imageUrl":"https://image.msscdn.net/images/goods_img/20261020/7565022/7565022_17927392302099_500.jpg","productUrl":"https://www.musinsa.com/app/goods/7565022","category":"아우터"}]};

const PAGES_URL = 'https://pagom86.github.io/my-daily-pick/data/products.json';

let PRODUCTS = [];
let currentSite = 'all';
let currentCat = 'all';
let likedItems = new Set(JSON.parse(localStorage.getItem('liked') || '[]'));

function saveLiked() {
  try { localStorage.setItem('liked', JSON.stringify([...likedItems])); } catch(e){}
}

function formatPrice(n) {
  if (!n) return '가격 미정';
  return n.toLocaleString('ko-KR') + '원';
}

function getFiltered() {
  let items = PRODUCTS.filter(p => {
    if (currentSite !== 'all' && p.site !== currentSite) return false;
    if (currentCat !== 'all' && p.cat !== currentCat) return false;
    return true;
  });
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'price-asc') items.sort((a,b) => (a.price||0) - (b.price||0));
  else if (sort === 'price-desc') items.sort((a,b) => (b.price||0) - (a.price||0));
  else if (sort === 'discount') items.sort((a,b) => (b.discount||0) - (a.discount||0));
  return items;
}

function renderGrid() {
  const items = getFiltered();
  const grid = document.getElementById('productGrid');
  const empty = document.getElementById('emptyState');
  document.getElementById('count').textContent = items.length;

  if (items.length === 0) {
    grid.innerHTML = '';
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  grid.innerHTML = items.map(p => `
    <div class="card" onclick="openItem('${p.id}')">
      <div class="card-img">
        ${p.imageUrl
          ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
          : ''}
        <div class="card-img-placeholder" style="${p.imageUrl ? 'display:none' : ''}">
          ${p.site === 'musinsa' ? '👕' : '🛍'}
        </div>
        <div class="card-badge badge-${p.site}">${p.site === 'musinsa' ? '무신사' : '29CM'}</div>
        <button class="card-like ${likedItems.has(p.id) ? 'liked' : ''}"
          onclick="event.stopPropagation(); toggleLike('${p.id}', this)">
          ${likedItems.has(p.id) ? '❤️' : '🤍'}
        </button>
      </div>
      <div class="card-info">
        <div class="card-brand">${p.brand || ''}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-price">
          ${p.discount ? `<span class="discount">${p.discount}%</span>` : ''}
          ${formatPrice(p.price)}
        </div>
      </div>
    </div>
  `).join('');
}

function toggleLike(id, btn) {
  if (likedItems.has(id)) {
    likedItems.delete(id);
    btn.textContent = '🤍';
    btn.classList.remove('liked');
  } else {
    likedItems.add(id);
    btn.textContent = '❤️';
    btn.classList.add('liked');
  }
  saveLiked();
}

function openItem(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  if (p.productUrl) window.open(p.productUrl, '_blank');
}

function applyData(json) {
  PRODUCTS = (json.items || []).map((p, i) => ({ ...p, id: p.id || String(i) }));
  if (json.updatedAt) {
    const d = new Date(json.updatedAt);
    document.getElementById('count').dataset.updated =
      `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} 업데이트`;
  }
}

async function loadData() {
  const empty = document.getElementById('emptyState');
  const msg = document.getElementById('emptyMsg');
  empty.classList.add('show');
  msg.textContent = '불러오는 중...';

  if (window.__STATIC_DATA__) {
    applyData(window.__STATIC_DATA__);
    if (PRODUCTS.length > 0) { empty.classList.remove('show'); renderGrid(); return; }
  }

  msg.textContent = '데이터 로딩 실패 — 새로고침 해봐';
}

function refreshFeed() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  loadData().finally(() => {
    setTimeout(() => btn.classList.remove('spinning'), 500);
  });
}

function showAddSite() {
  alert('추후 지원 예정!');
}

// Site buttons
document.querySelectorAll('.site-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.site-btn').forEach(b => b.className = 'site-btn');
    currentSite = btn.dataset.site;
    if (currentSite === 'all') btn.classList.add('active-all');
    else if (currentSite === 'musinsa') btn.classList.add('active-musinsa');
    else if (currentSite === 'cm29') btn.classList.add('active-cm29');
    renderGrid();
  });
});

// Category chips
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentCat = chip.dataset.cat;
    renderGrid();
  });
});

loadData();
</script>
